# Single-host production stack: one web/API container plus Postgres.
# External hosting (Render, Railway, Fly) runs the same image built by ./Dockerfile
# against a managed Postgres, so it does not need this file.
name: crest-shelf-finder-prod

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: crest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: crest
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crest -d crest"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql+psycopg://crest:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/crest
    # Optional AI key for "Draft outreach"; the template fallback works without it.
    env_file:
      - path: /run/base44/app.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db-data:
