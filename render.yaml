# Free trial hosting: Render's free Postgres expires after 30 days.
# Choose paid plans in Render before using this for ongoing team work.
services:
  - type: web
    name: creset-shelf-finder-will
    runtime: docker
    plan: free
    region: virginia
    branch: wills-branch
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: creset-shelf-finder-will-db
          property: connectionString

databases:
  - name: creset-shelf-finder-will-db
    plan: free
    region: virginia
    databaseName: creset
    user: creset
    ipAllowList: []
