name: crest-shelf-finder

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: crest
      POSTGRES_PASSWORD: crest_dev_password
      POSTGRES_DB: crest
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crest -d crest"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: on-failure
    working_dir: /app
    command: ["sh", "-ec", "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://crest:crest_dev_password@db:5432/crest
      - BASE44_PREVIEW_MODE
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: node:22-bookworm-slim
    restart: on-failure
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    labels:
      base44.project: Crest Shelf Finder
      base44.kind: web
      base44.port: 3000
    healthcheck:
      test:
        - CMD-SHELL
        - |
          node -e 'Promise.all([fetch("http://localhost:3000/"), fetch("http://localhost:3000/api/health")]).then((rs) => { if (rs.every((r) => r.ok)) process.exit(0); console.error(rs.map((r) => r.status).join(",")); process.exit(1); }).catch((e) => { console.error(e.message); process.exit(1); })'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  db-data:
  web-node-modules:
