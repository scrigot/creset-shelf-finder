name: crest-shelf-finder

services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: crest
      POSTGRES_PASSWORD: crest_dev_password
      POSTGRES_DB: crest
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crest -d crest"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: ./backend
    restart: on-failure
    working_dir: /app
    env_file:
      - ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg://crest:crest_dev_password@db:5432/crest
      - SEED_DEMO_DATA=1
      - BASE44_PREVIEW_MODE
    volumes:
      - ./backend:/app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    labels:
      base44.project: Crest Shelf Finder API
      base44.kind: api
      base44.docs: /docs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    environment:
      - VITE_API_PROXY_TARGET=http://api:8000
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command:
      ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    labels:
      base44.project: Crest Shelf Finder
      base44.kind: web
      base44.port: 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:3000/'), fetch('http://127.0.0.1:3000/api/health')]).then((rs) => { if (rs.every((r) => r.ok)) process.exit(0); console.error(rs.map((r) => r.status).join(',')); process.exit(1); }).catch((e) => { console.error(e.message); process.exit(1); })",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

volumes:
  db_data:
  web_node_modules:
